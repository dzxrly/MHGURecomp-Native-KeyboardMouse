name: Independent release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Dedicated self-hosted runners to use
        type: choice
        options: [windows, linux, both]
        default: windows
      publish:
        description: Publish the completed archives as this repository's release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: independent-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        env:
          PLATFORM: ${{ inputs.platform }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < UPSTREAM_VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/morerokk/MHGURecomp/git/ref/tags/$version" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          platforms = ['windows', 'linux'] if os.environ['PLATFORM'] == 'both' else [os.environ['PLATFORM']]
          entries = [{'platform': p, 'os': 'Windows' if p == 'windows' else 'Linux'} for p in platforms]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps({'include': entries}) + '\n')
          PY

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: [self-hosted, '${{ matrix.os }}', X64, mhgu-release]
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MSYSTEM: UCRT64
      CHERE_INVOKING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Windows from prepared dependencies (no ROM)
        if: matrix.platform == 'windows'
        shell: C:\msys64\usr\bin\bash.exe --login -e -o pipefail {0}
        run: |
          test -n "${MHGU_RELEASE_INPUTS:-}" || { echo 'Set MHGU_RELEASE_INPUTS on this dedicated runner.'; exit 1; }
          python3 tools/release.py --inputs "$MHGU_RELEASE_INPUTS" --version "$VERSION"
      - name: Build Linux from prepared dependencies (no ROM)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MHGU_RELEASE_INPUTS:-}" || { echo 'Set MHGU_RELEASE_INPUTS on this dedicated runner.'; exit 1; }
          python3 tools/release.py --inputs "$MHGU_RELEASE_INPUTS" --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ needs.prepare.outputs.version }}
          path: |
            dist/Windows-MHGURecomp.*.zip
            dist/ArchLinux-MHGURecomp.*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ needs.prepare.outputs.version }}
          merge-multiple: true
          path: dist
      - name: Publish this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'This version already has a release; existing assets will not be replaced.'
            exit 1
          fi
          if tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq '.object.sha' 2>/dev/null); then
            tag_sha=$(gh api "repos/$GH_REPO/commits/$VERSION" --jq '.sha')
            test "$tag_sha" = "$GITHUB_SHA" || { echo 'Existing version tag points to another commit.'; exit 1; }
          fi
          printf 'Independent native keyboard/mouse build following upstream %s.\n\nAuto prompt mod included. Supply your own merged Switch MHGU 1.4.0 exefs/romfs.\n\nSource commit: %s\n' "$VERSION" "$GITHUB_SHA" > release-notes.txt
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "$VERSION - Native Keyboard & Mouse" --notes-file release-notes.txt --latest
