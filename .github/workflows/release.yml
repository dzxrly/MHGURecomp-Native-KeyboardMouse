name: Independent release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: GitHub-hosted platforms to build
        type: choice
        options: [windows, linux, both]
        default: windows
      publish:
        description: Publish the completed archives as this repository's release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: independent-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          PLATFORM: ${{ inputs.platform }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < UPSTREAM_VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/morerokk/MHGURecomp/git/ref/tags/$version" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          platforms = ['windows', 'linux'] if os.environ['PLATFORM'] == 'both' else [os.environ['PLATFORM']]
          entries = [{'platform': p, 'runner': 'windows-latest' if p == 'windows' else 'ubuntu-26.04'} for p in platforms]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps({'include': entries}) + '\n')
          PY

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up current MSYS2 UCRT64 toolchain
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            make git diffutils
            mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-shaderc mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-pillow
      - name: Build Windows with repository prompts and verified upstream game library
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          python3 tools/release.py --version "$VERSION"
      - name: Build Linux in current Arch toolchain (no ROM)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e VERSION -v "$PWD:/work" -w /work archlinux:latest bash -e -c '
            pacman -Syu --noconfirm --needed base-devel git clang lld python python-pillow \
              sdl3 vulkan-headers vulkan-icd-loader shaderc nasm
            git config --global --add safe.directory /work
            python tools/release.py --version "$VERSION"
          '
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.platform }}-${{ needs.prepare.outputs.version }}
          path: |
            dist/Windows-MHGURecomp.*.zip
            dist/ArchLinux-MHGURecomp.*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*-${{ needs.prepare.outputs.version }}
          merge-multiple: true
          path: dist
      - name: Publish this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'This version already has a release; existing assets will not be replaced.'
            exit 1
          fi
          if tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq '.object.sha' 2>/dev/null); then
            tag_sha=$(gh api "repos/$GH_REPO/commits/$VERSION" --jq '.sha')
            test "$tag_sha" = "$GITHUB_SHA" || { echo 'Existing version tag points to another commit.'; exit 1; }
          fi
          printf 'Independent native keyboard/mouse build following upstream %s.\n\nAuto prompt mod included. Supply your own merged Switch MHGU 1.4.0 exefs/romfs.\n\nSource commit: %s\n' "$VERSION" "$GITHUB_SHA" > release-notes.txt
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "$VERSION - Native Keyboard & Mouse" --notes-file release-notes.txt --latest
